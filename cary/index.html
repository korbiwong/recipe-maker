<style>
/* Cary: a dark, warm calorie tracker. Espresso background, honey-gold accent, cream text; cards with soft edges; a bottom tab bar like a phone app. */
:root {
  --bg: #160f0b; --glow: #3a2414; --card: #241911; --card2: #2f2117; --field: #1b130d; --line: #4a3627;
  --ink: #fbf1e3; --muted: #c4ae97; --gold: #f6b93b; --gold-ink: #1d1208;
  --coral: #ff6b4a; --green: #8fd16f; --blue: #7cc8f2; --pro: #ff8a6b; --carb: #f6b93b; --fat: #7cc8f2;
  --bubble: #fff1d6; --bubble-ink: #2a1a0c;
  color-scheme: dark;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html { -webkit-text-size-adjust: 100% }
body { margin: 0; min-height: 100vh; background: radial-gradient(120% 50% at 50% 0%, var(--glow) 0%, var(--bg) 70%) fixed, var(--bg); color: var(--ink);
  font: 400 16px/1.55 "Noto Sans HK", "PingFang HK", "PingFang TC", system-ui, sans-serif;
  padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px)) }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-left, 0px)) 0 max(16px, env(safe-area-inset-right, 0px)) }
h1, h2, h3, p { margin: 0 }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px }
input, select { font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 14px; padding: 11px 12px; width: 100%; min-width: 0 }
input::placeholder { color: #8a7562 }

/* top bar */
.top { position: sticky; top: 0; z-index: 10; padding: calc(10px + env(safe-area-inset-top, 0px)) 0 10px; background: linear-gradient(var(--bg) 70%, transparent) }
.top .wrap { display: flex; align-items: center; gap: 10px }
.top img { width: 36px; height: 36px; border-radius: 10px; display: block }
.brand { font-weight: 900; font-size: 1.6rem; letter-spacing: -0.02em; color: var(--gold); flex: 1 }
.pill { background: var(--card2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 0.9rem; font-weight: 700; white-space: nowrap }

/* cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px; margin: 12px 0; display: grid; gap: 12px }
.card h2 { font-size: 1.05rem; font-weight: 700 }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.row > .grow { flex: 1; min-width: 0 }
.hint, .desc { color: var(--muted); font-size: 0.88rem }
.big { font-weight: 900; font-size: 2.4rem; line-height: 1.1; letter-spacing: -0.02em }
.big small { font-size: 1rem; font-weight: 700; color: var(--muted) }

/* buttons */
.primary { background: var(--gold); color: var(--gold-ink); border: 0; border-radius: 999px; padding: 11px 20px; font-weight: 700 }
.primary:disabled { opacity: 0.5 }
.btn2, .chip { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; font-weight: 700 }
.btn2:disabled { opacity: 0.5 }
.small { padding: 6px 12px; font-size: 0.88rem }
.linkbtn { background: none; border: 0; padding: 0; color: var(--gold); text-decoration: underline; font-size: 0.9rem; justify-self: start }
.iconbtn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--card2); display: grid; place-items: center; padding: 0; font-size: 1.1rem; line-height: 1; flex: none }
.acts2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.wide { width: 100% }

/* segmented options */
.seg { display: flex; flex-wrap: wrap; gap: 8px }
.opt { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 0.95rem }
.opt[aria-checked="true"] { background: var(--gold); color: var(--gold-ink); border-color: var(--gold) }
.optcards { display: grid; gap: 10px }
.optcards .opt { border-radius: 18px; padding: 14px 16px; text-align: left; display: grid; gap: 2px; font-size: 1.05rem }
.optcards .opt small { font-weight: 400; font-size: 0.85rem; color: var(--muted) }
.optcards .opt[aria-checked="true"] small { color: var(--gold-ink) }
label.f { display: grid; gap: 6px; font-weight: 700; font-size: 0.92rem }
label.f > span small { font-weight: 400; color: var(--muted) }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.unit { display: flex; align-items: center; gap: 8px } .unit span { color: var(--muted); white-space: nowrap }
.check { display: flex; gap: 10px; align-items: center; font-weight: 700 }
.check input { width: 22px; height: 22px; accent-color: var(--gold); flex: none }

/* date strip */
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 4px }
.strip button { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 6px 0; display: grid; gap: 0; justify-items: center; font-size: 0.78rem; color: var(--muted) }
.strip button b { font-size: 1.05rem; color: var(--ink) }
.strip button i { width: 6px; height: 6px; border-radius: 50%; background: transparent; margin-top: 2px }
.strip button.has i { background: var(--gold) }
.strip button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--gold-ink) }
.strip button[aria-pressed="true"] b { color: var(--gold-ink) }
.strip button[aria-pressed="true"] i { background: var(--gold-ink) }

/* calories ring and macro bars */
.ringrow { display: flex; gap: 18px; align-items: center; flex-wrap: wrap }
.ring { width: 150px; height: 150px; position: relative; flex: none }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block }
.ring .bg { fill: none; stroke: #3a2a1d; stroke-width: 13 }
.ring .fg { fill: none; stroke: var(--gold); stroke-width: 13; stroke-linecap: round }
.ring.over .fg { stroke: var(--coral) }
.ring .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.15 }
.ring .mid b { font-weight: 900; font-size: 2rem; letter-spacing: -0.02em }
.ring .mid small { font-size: 0.78rem; color: var(--muted) }
.macros { flex: 1; min-width: 170px; display: grid; gap: 10px }
.macro { display: grid; gap: 4px }
.macro .row { justify-content: space-between; font-size: 0.88rem }
.macro .row b { font-weight: 700 }
.macro .row span { color: var(--muted) }
.mbar { height: 9px; border-radius: 99px; background: #3a2a1d; overflow: hidden }
.mbar i { display: block; height: 100% ; border-radius: 99px }
.mbar.over i { background: var(--coral) !important }

/* meals */
.slothead { display: flex; align-items: center; gap: 10px }
.slothead h3 { font-size: 1rem; font-weight: 700; flex: 1 }
.slothead span { color: var(--muted); font-size: 0.88rem }
.item { background: var(--card2); border-radius: 16px; padding: 10px 12px; display: grid; gap: 6px }
.item .row { flex-wrap: nowrap; align-items: flex-start }
.item strong { font-weight: 700 }
.item .sub { font-size: 0.82rem; color: var(--muted) }
.empty { color: var(--muted); font-size: 0.88rem; padding: 2px 0 }
.slot + .slot { border-top: 1px solid var(--line); padding-top: 12px }
.slot { display: grid; gap: 8px }

/* the comment bubble */
.bubble { background: var(--bubble); color: var(--bubble-ink); border-radius: 18px 18px 18px 6px; padding: 9px 14px; font-weight: 700; font-size: 0.95rem; line-height: 1.5 }
.bubble::before { content: "Cary 話"; display: block; font-size: 0.72rem; font-weight: 700; color: #8a5a1e; letter-spacing: 0.04em }

/* water and exercise */
.cups { display: flex; flex-wrap: wrap; gap: 6px }
.cup { width: 24px; height: 30px; border: 2px solid var(--line); border-radius: 4px 4px 9px 9px; background: transparent }
.cup.on { background: var(--blue); border-color: var(--blue) }
.exlist { display: grid; gap: 6px; list-style: none; margin: 0; padding: 0 }
.exlist li { display: flex; justify-content: space-between; gap: 8px; align-items: center; background: var(--card2); border-radius: 12px; padding: 8px 12px; font-size: 0.92rem }

/* stats and charts */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px }
.stat small { color: var(--muted); font-size: 0.8rem; display: block }
.stat b { font-weight: 900; font-size: 1.4rem; letter-spacing: -0.01em }
.chart { display: block; width: 100%; height: auto }
.chart .ax { stroke: var(--line); stroke-width: 1 }
.chart .tg { stroke: var(--green); stroke-width: 2; stroke-dasharray: 6 5 }
.chart .ln { fill: none; stroke: var(--gold); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round }
.chart .pt { fill: var(--card); stroke: var(--gold); stroke-width: 2.5 }
.chart .bar { fill: var(--gold) } .chart .bar.over { fill: var(--coral) } .chart .bar.none { fill: var(--line) }
.chart text { fill: var(--muted); font-size: 11px; font-family: inherit }
.kv { display: grid; gap: 0; margin: 0 }
.kv div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line) }
.kv div:last-child { border-bottom: 0 }
.kv dt { color: var(--muted) } .kv dd { margin: 0; font-weight: 700; text-align: right }
.warn { background: #3d2a12; border: 1px solid #7a5520; color: #ffd9a0; border-radius: 14px; padding: 10px 12px; font-size: 0.88rem }

/* hits from the food list */
.hits { display: grid; gap: 6px }
.hits button { display: flex; justify-content: space-between; gap: 10px; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px }
.hits button span { color: var(--muted); white-space: nowrap }
.rrow { display: grid; grid-template-columns: minmax(0, 1fr) 90px 34px; gap: 6px; align-items: center }
.rrow input { padding: 8px 10px }
.thumb { width: 100%; max-height: 220px; object-fit: cover; border-radius: 16px; display: block }

/* floating camera button and bottom tabs */
.fab { position: fixed; right: max(18px, calc(50vw - 262px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 20; width: 64px; height: 64px; border-radius: 50%; border: 0;
  background: var(--gold); color: var(--gold-ink); font-size: 1.7rem; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5), 0 0 0 4px rgba(246, 185, 59, 0.2) }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: rgba(22, 15, 11, 0.94); border-top: 1px solid var(--line);
  padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px)); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px) }
.tabbar .wrap { display: grid; grid-template-columns: repeat(3, 1fr) }
.tabbar button { background: none; border: 0; display: grid; justify-items: center; gap: 2px; padding: 6px 0; color: var(--muted); font-size: 0.78rem; font-weight: 700 }
.tabbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
.tabbar button[aria-current="page"] { color: var(--gold) }

/* bottom sheet and dialogs */
dialog { color: var(--ink) }
dialog::backdrop { background: rgba(0, 0, 0, 0.6) }
dialog.sheet { margin: auto auto 0; width: 100%; max-width: 560px; max-height: 90vh; border: 1px solid var(--line); border-bottom: 0; border-radius: 26px 26px 0 0; background: var(--card2);
  padding: 16px 16px calc(18px + env(safe-area-inset-bottom, 0px)); overflow: auto }
dialog.sheet[open] { display: grid; gap: 14px }
.sheethead { display: flex; align-items: center; gap: 10px } .sheethead h2 { flex: 1; font-size: 1.2rem; font-weight: 900 }
dialog.keydlg { border: 1px solid var(--line); border-radius: 22px; padding: 18px; width: min(440px, 92vw); background: var(--card2) }
dialog.keydlg[open] { display: grid; gap: 12px }
dialog.keydlg h2 { font-size: 1.2rem; font-weight: 900 }
.spin { width: 38px; height: 38px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--gold); animation: spin 0.9s linear infinite; justify-self: center }
@keyframes spin { to { transform: rotate(360deg) } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s } }
.toast { position: fixed; left: 50%; bottom: calc(160px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: var(--ink); color: var(--gold-ink); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 0.92rem; max-width: 90vw; text-align: center }
.tabs.acct { display: flex; flex-wrap: wrap; gap: 8px }

/* first-run questions */
.onb { position: fixed; inset: 0; z-index: 30; background: radial-gradient(120% 60% at 50% 0%, var(--glow) 0%, var(--bg) 70%), var(--bg); overflow: auto }
.onb .wrap { min-height: 100%; display: flex; flex-direction: column; gap: 18px; padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)) }
.onb .prog { height: 6px; border-radius: 99px; background: var(--card2); overflow: hidden } .onb .prog i { display: block; height: 100%; background: var(--gold) }
.onb h1 { font-size: 1.8rem; font-weight: 900; line-height: 1.25; letter-spacing: -0.01em }
.onb .body { display: grid; gap: 14px; align-content: start; flex: 1 }
.onb .foot { display: grid; gap: 10px }
.onb .foot .primary { padding: 15px; font-size: 1.05rem }
.hero { display: grid; justify-items: center; text-align: center; gap: 14px; padding-top: 8vh }
.hero img { width: 104px; height: 104px; border-radius: 28px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5) }
.hero .brand { font-size: 3rem; flex: none }
.hero p { color: var(--muted); font-size: 1.1rem; white-space: pre-line }
.bmi { font-weight: 700; color: var(--gold) }
</style>
</head>

<header class="top"><div class="wrap"><img src="../icon-192.png" alt=""><span class="brand">Cary</span><span class="pill" id="streak" hidden></span></div></header>

<main class="wrap">
  <section id="pgToday" aria-label="今日"></section>
  <section id="pgProg" aria-label="進度" hidden></section>
  <section id="pgMe" aria-label="我" hidden>
    <div id="meForm"></div>
    <div class="card">
      <h2>帳戶同 API key</h2>

      <div class="tabs acct" id="acct"></div>
      <div class="acts2"><button type="button" class="btn2 small" id="redo">重新答一次開頭啲問題</button><a class="linkbtn" href="../">去食譜製造器</a></div>
    </div>
  </section>
</main>

<button type="button" class="fab" id="fab" aria-label="影相記低食物">📸</button>
<nav class="tabbar" aria-label="頁面"><div class="wrap">
  <button type="button" data-pg="today" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>今日</button>
  <button type="button" data-pg="prog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>進度</button>
  <button type="button" data-pg="me"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>我</button>
</div></nav>

<dialog class="sheet" id="sheet"></dialog>
<div class="onb" id="onb" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="pin" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>

      body.appendChild(field("身高", hi, "cm")); body.appendChild(field("體重", wi, "kg")); body.appendChild(bmi);
      foot.appendChild(next); chk();
    } else if (s === "target") {
      body.appendChild(el("h1", null, me.goal === "cut" ? "想減到幾多？" : "想增到幾多？"));
      var ti = el("input"); ti.type = "number"; ti.inputMode = "decimal"; ti.min = 30; ti.max = 250; ti.step = 0.1; ti.value = me.tw || ""; ti.placeholder = me.w ? String(me.goal === "cut" ? Math.round(me.w - 5) : Math.round(me.w + 3)) : "";
      ti.oninput = function () { me.tw = Number(ti.value) || 0; };
      body.appendChild(field("目標體重（選填）", ti, "kg"));
      body.appendChild(el("p", "hint", "想幾快？"));
      body.appendChild(seg([[0.5, "每週 0.5 kg", "穩陣，易維持"], [0.75, "每週 0.75 kg", "有少少挑戰"], [1, "每週 1 kg", "要配合運動"]], me.pace || 0.5, function (v) { me.pace = v; }, true));
      foot.appendChild(next);
    } else if (s === "act") {
      body.appendChild(el("h1", null, "平時郁得幾多？"));
      body.appendChild(seg([[0, "少郁", "返工返學多數坐"], [1, "輕度", "每週運動 1–3 日"], [2, "中度", "每週運動 3–5 日"], [3, "高", "每週運動 6–7 日"]], me.act, function (v) { me.act = v; }, true));
      foot.appendChild(next);
    } else if (s === "tone") {
      body.appendChild(el("h1", null, "揀 Cary 把口"));
      body.appendChild(el("p", "hint", "每次影相記低，Cary 都會用呢個語氣評你一句。"));
      body.appendChild(seg(Object.keys(TONES).map(function (k) { return [k, TONES[k][0]]; }), me.tone, function (v) { me.tone = v; }));
      var ck = el("label", "check"), cb = el("input"); cb.type = "checkbox"; cb.checked = !!me.spicy; cb.onchange = function () { me.spicy = cb.checked; };
      ck.appendChild(cb); ck.appendChild(document.createTextNode("可以講粗口同講我身形（18+）")); body.appendChild(ck);
      foot.appendChild(next);
    } else {
      var mp = mePlan();
      body.appendChild(el("h1", null, "你嘅計劃準備好"));
      if (mp) {
        var c = card(); var big = el("div", "big", mp.target + " "); big.appendChild(el("small", null, "kcal／日")); c.appendChild(big);
        var tg = macroTargets(mp, 0); c.appendChild(el("p", "hint", "蛋白質 " + tg.p + " 克 · 碳水 " + tg.c + " 克 · 脂肪 " + tg.f + " 克 · 飲水 " + cupsGoal() + " 杯"));
        if (mp.weeks) { var eta = new Date(); eta.setDate(eta.getDate() + mp.weeks * 7); c.appendChild(el("p", null, "大約 " + mp.weeks + " 個星期去到 " + mp.tw + " kg（" + eta.getFullYear() + " 年 " + (eta.getMonth() + 1) + " 月）。")); }
        if (mp.warn) c.appendChild(el("p", "warn", mp.warn));
        body.appendChild(c);
      } else body.appendChild(el("p", "hint", "未有身高體重，遲啲喺「我」頁填返就得。"));
      next.textContent = "開始用 Cary"; next.onclick = onbEnd; foot.appendChild(next);
    }
    w.appendChild(body); w.appendChild(foot);
  }

  /* ---- start: wait for the account (and its saved profile) before deciding whether to ask the first-run questions ---- */
  function onbDone() { try { return localStorage.getItem("cary-onb") === "1"; } catch (e) { return false; } }
  var decided = false;
  function decide() { if (decided) return; decided = true; if (!onbDone() && !(me.h && me.w)) onbStart(0); }
  render();
  dbReady.then(function (col) {
    cloud = col || null;
    render();
    if (!col) { decide(); return; }
    setTimeout(decide, 4000);
    col.doc("profile").onSnapshot(function (snap) {
      var d = snap.exists ? snap.data() : null, cached = snap.metadata && snap.metadata.fromCache;
      if (!d && !cached && !meDirty && me.h && me.w) { meSave(); decide(); return; }
      if (d && !meDirty && Number(d.t) !== me.t) { meClean(d); try { localStorage.setItem("recipe-maker-me", JSON.stringify(me)); } catch (e) {} fillMe(); render(); }
      if (!cached) decide();
    }, function () { decide(); });
    // Months saved only in this browser before signing in: merge them into the account, then drop the local copy.
    var keys = [];
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (/^recipe-maker-meals-\d{4}-\d{2}$/.test(k)) keys.push(k); } } catch (e) {}
    keys.forEach(function (k) {
      var local; try { local = cleanDays(JSON.parse(localStorage.getItem(k))); } catch (e) { return; }
      if (!Object.keys(local).length) { try { localStorage.removeItem(k); } catch (e) {} return; }
      mutate(new Date(+k.slice(-7, -3), +k.slice(-2) - 1, 1), function (d) {
        Object.keys(local).forEach(function (day) {
          if (day.charAt(0) === "w") { if (local[day].length > (d[day] || []).length) d[day] = local[day]; return; }
          var have = {}; (d[day] = d[day] || []).forEach(function (e) { have[e.id] = true; });
          local[day].forEach(function (e) { if (!have[e.id]) d[day].push(e); });
        });
      }).then(function () { try { localStorage.removeItem(k); } catch (e) {} }, function () {});
    });
  });
  // Midnight: move "today" along if the page stays open.
  var lastDay = isoDay(new Date());
  setInterval(function () { var d = isoDay(new Date()); if (d !== lastDay) { if (sel === lastDay) sel = d; lastDay = d; render(); } }, 60000);
})();
