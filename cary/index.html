<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cary</title>
<meta name="description" content="影張相就知食咗幾多卡路里，仲會評你兩句。">
<meta name="theme-color" content="#121010">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cary">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700;900&display=swap">
<script src="../firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../app.js"></script>
<style>
/* Cary: near-black warm background, charcoal cards, amber accent, teal for exercise. A floating pill tab bar with a round add button, like a phone app. */
:root {
  --bg: #121010; --card: #1e1b19; --card2: #282421; --field: #171413; --line: #322d29; --line2: #3e3833;
  --ink: #f6f1ec; --muted: #9b928a; --dim: #6f6761;
  --amber: #ffa21f; --amber-ink: #1a1005; --teal: #5db3a6; --teal-ink: #0d1f1c;
  --red: #ff5f4d; --green: #7fd18a; --pro: #ff7a6b; --carb: #f2b33d; --fat: #5fc4c9; --fib: #8bd17c; --sug: #f28ab2; --sod: #8fa8ff;
  --bubble: #3a2a14; --bubble-ink: #ffc061;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
[hidden] { display: none !important }
html { -webkit-text-size-adjust: 100% }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 400 16px/1.5 "Noto Sans HK", "PingFang HK", "PingFang TC", system-ui, sans-serif;
  padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)) }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)) }
h1, h2, h3, p { margin: 0 }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0 }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px }
input, select, textarea { font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line2); border-radius: 14px; padding: 11px 12px; width: 100%; min-width: 0 }
input::placeholder, textarea::placeholder { color: var(--dim) }
.ic { display: inline-grid; place-items: center; flex: none }
.ic svg { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block }
.muted { color: var(--muted) } .hint { color: var(--muted); font-size: 0.86rem } .num { font-variant-numeric: tabular-nums }

/* header */
.top { position: sticky; top: 0; z-index: 10; padding: calc(10px + env(safe-area-inset-top, 0px)) 0 8px; background: linear-gradient(var(--bg) 75%, rgba(18, 16, 16, 0)) }
.top .wrap { display: flex; align-items: center; gap: 10px; min-height: 44px }
.logo { width: 40px; height: 40px; border-radius: 50%; display: block; border: 2px solid var(--amber) }
.brand { font-weight: 900; font-size: 1.5rem; letter-spacing: -0.01em; flex: 1 }
.pagetitle { font-weight: 900; font-size: 1.7rem; flex: 1 }
.pill { display: inline-flex; align-items: center; gap: 5px; background: var(--card2); border-radius: 999px; padding: 4px 11px; font-size: 0.82rem; font-weight: 700; white-space: nowrap }
.pill.cyc { color: #b9a6ff; background: #2a2540 }
.pill .ic { color: var(--amber) }

/* cards */
.card { background: var(--card); border-radius: 22px; padding: 16px; margin: 12px 0; display: grid; gap: 12px }
.card h2 { font-size: 1rem; font-weight: 700 }
.row { display: flex; align-items: center; gap: 10px }
.grow { flex: 1; min-width: 0 }
.sect { margin: 22px 4px 6px; display: flex; align-items: baseline; gap: 8px; font-size: 0.92rem; font-weight: 700; color: var(--muted) }
.sect .grow + span { font-size: 0.78rem; font-weight: 400 }

/* buttons */
.primary { background: var(--amber); color: var(--amber-ink); border-radius: 999px; padding: 12px 20px; font-weight: 700; text-align: center }
.primary:disabled, .btn2:disabled { opacity: 0.5 }
.btn2 { border: 1px solid var(--line2); border-radius: 999px; padding: 9px 16px; font-weight: 700; text-align: center }
.small { padding: 6px 12px; font-size: 0.86rem }
.wide { width: 100% }
.linkbtn { color: var(--amber); text-decoration: underline; font-size: 0.9rem }
.iconbtn { width: 36px; height: 36px; border-radius: 50%; background: var(--card2); display: inline-grid; place-items: center; flex: none }
.acts2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }

/* options */
.seg { display: flex; flex-wrap: wrap; gap: 8px }
.opt { border: 1px solid var(--line2); border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 0.92rem }
.opt[aria-checked="true"] { background: var(--amber); color: var(--amber-ink); border-color: var(--amber) }
.optcards { display: grid; gap: 10px }
.optcards .opt { border-radius: 18px; padding: 14px 16px; text-align: left; display: grid; gap: 2px; font-size: 1.02rem }
.optcards .opt small { font-weight: 400; font-size: 0.84rem; color: var(--muted) }
.optcards .opt[aria-checked="true"] small { color: var(--amber-ink) }
label.f { display: grid; gap: 6px; font-weight: 700; font-size: 0.9rem }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.unit { display: flex; align-items: center; gap: 8px } .unit > span { color: var(--muted); white-space: nowrap }
.check { display: flex; gap: 10px; align-items: center; font-weight: 700 }
.check input { width: 22px; height: 22px; accent-color: var(--amber); flex: none }

/* week strip */
.strip { background: var(--card); border-radius: 22px; padding: 10px 6px; display: grid; grid-template-columns: repeat(7, 1fr); margin-top: 4px }
.strip button { display: grid; justify-items: center; gap: 6px; font-size: 0.75rem; color: var(--dim); padding: 2px 0 }
.strip button b { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 1rem; font-weight: 700; color: var(--ink) }
.strip button i { width: 5px; height: 5px; border-radius: 50%; margin-top: -2px }
.strip button.has i { background: var(--amber) }
.strip button[aria-pressed="true"] b { background: var(--amber); color: var(--amber-ink) }

/* summary */
.sum { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center }
.tag { display: inline-flex; align-items: center; gap: 4px; background: #1d3a33; color: #7fe0c8; border-radius: 999px; padding: 2px 9px; font-size: 0.72rem; font-weight: 700; justify-self: start }
.huge { font-weight: 900; font-size: 2.9rem; line-height: 1.05; letter-spacing: -0.02em }
.huge.over { color: var(--red) }
.sumline { font-size: 0.9rem; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 6px }
.sumline b { color: var(--amber); font-weight: 700 }
.exlink { background: #1d3a33; color: #7fe0c8; border-radius: 999px; padding: 1px 8px; font-size: 0.78rem; font-weight: 700 }
.ring { width: 118px; height: 118px; position: relative; grid-row: 1 / span 4; grid-column: 2 }
.ring svg.r { width: 100%; height: 100%; transform: rotate(-90deg); display: block }
.ring .bg { fill: none; stroke: #2e2926; stroke-width: 10 }
.ring .fg { fill: none; stroke: var(--amber); stroke-width: 10; stroke-linecap: round }
.ring.over .fg { stroke: var(--red) }
.ring .mid { position: absolute; inset: 0; display: grid; place-items: center; color: var(--amber); font-size: 2rem }
.ring.over .mid { color: var(--red) }
.chips2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.chips2 div { background: var(--card2); border-radius: 12px; padding: 7px 10px; display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--muted); white-space: nowrap; overflow: hidden }
.chips2 b { color: var(--ink); font-weight: 700 }
.chips2 .ic { color: #9fb3ff } .chips2 div + div .ic { color: var(--amber) }

/* macro pager */
.pager { display: grid; grid-auto-flow: column; grid-auto-columns: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 12px 0 0 }
.pager::-webkit-scrollbar { display: none }
.page3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; scroll-snap-align: start }
.mac { background: var(--card); border-radius: 18px; padding: 12px 8px; display: grid; justify-items: center; gap: 4px; text-align: center }
.mini { width: 48px; height: 48px; position: relative }
.mini svg.r { width: 100%; height: 100%; transform: rotate(-90deg) }
.mini .bg { fill: none; stroke: #2e2926; stroke-width: 5 }
.mini .fg { fill: none; stroke-width: 5; stroke-linecap: round }
.mini .ic { position: absolute; inset: 0; font-size: 0.85rem }
.mac small { font-size: 0.78rem; color: var(--muted) }
.mac b { font-weight: 700; font-size: 0.95rem } .mac b span { color: var(--dim); font-weight: 400; font-size: 0.75rem }
.mac.over b { color: var(--red) }
.dots { display: flex; justify-content: center; gap: 5px; margin: 8px 0 0 }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line2) } .dots i.on { background: var(--amber) }

/* action buttons */
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 }
.acts button { border-radius: 16px; padding: 14px 8px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px }
.eat { background: var(--amber); color: var(--amber-ink) } .move { background: var(--teal); color: var(--teal-ink) }

/* water strip */
.water { display: flex; align-items: center; gap: 10px }
.cups { display: flex; flex-wrap: wrap; gap: 4px; flex: 1 }
.cup { width: 15px; height: 20px; border: 2px solid var(--line2); border-radius: 3px 3px 6px 6px } .cup.on { background: var(--fat); border-color: var(--fat) }

/* diary */
.banner { background: var(--bubble); color: var(--bubble-ink); border-radius: 14px 14px 0 0; padding: 9px 14px; font-weight: 700; font-size: 0.88rem; display: flex; gap: 8px; align-items: flex-start }
.banner + .meal { border-top-left-radius: 0; border-top-right-radius: 0 }
.meal { background: var(--card); border-radius: 18px; padding: 10px; display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; width: 100%; text-align: left; margin-bottom: 10px }
.meal .ph { width: 96px; height: 84px; border-radius: 12px; background: var(--card2) center / cover; display: grid; place-items: center; font-size: 1.8rem; color: var(--dim) }
.meal .t { display: flex; gap: 8px; align-items: baseline } .meal .t strong { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.meal .t small { color: var(--muted); font-size: 0.78rem; white-space: nowrap }
.meal .k { font-weight: 900; font-size: 1.25rem; display: flex; align-items: center; gap: 4px } .meal .k .ic { color: var(--red) }
.meal .k.none { font-size: 0.9rem; font-weight: 700; color: var(--amber) }
.meal .m { display: flex; gap: 12px; font-size: 0.8rem; color: var(--muted) } .meal .m span { display: inline-flex; gap: 3px; align-items: center }
.slotlab { font-size: 0.72rem; color: var(--dim) }
.bubble { background: var(--bubble); color: var(--bubble-ink); border-radius: 16px 16px 16px 6px; padding: 9px 13px; font-weight: 700; font-size: 0.92rem }
.emptylog { background: var(--card); border-radius: 18px; padding: 22px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center }

/* progress */
.nchips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none } .nchips::-webkit-scrollbar { display: none }
.nchips button { flex: none; height: 34px; min-width: 34px; border-radius: 999px; background: var(--card2); display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 0 9px; font-size: 0.85rem; font-weight: 700 }
.nchips button[aria-pressed="true"] { background: var(--amber); color: var(--amber-ink) !important }
.status { text-align: right; font-size: 0.85rem; color: var(--green); font-weight: 700 } .status.over { color: var(--red) }
.chart { display: block; width: 100%; height: auto }
.chart .ax { stroke: var(--line); stroke-width: 1 } .chart .cap { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4 }
.chart .bar { fill: #3a332d } .chart .bar.has { fill: var(--amber) } .chart .bar.sel { fill: #ffc46b } .chart .bar.over { fill: var(--red) }
.chart text { fill: var(--dim); font-size: 10px; font-family: inherit } .chart text.sel { fill: var(--amber); font-weight: 700 }
.chart .capl { fill: var(--ink); font-size: 10px; font-weight: 700 } .chart .capbg { fill: var(--card2) }
.chart .ln { fill: none; stroke: var(--amber); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round } .chart .pt { fill: var(--amber) }
.chart .tg { stroke: var(--green); stroke-width: 1.5; stroke-dasharray: 5 4 }
.range { display: flex; align-items: center; gap: 8px } .range span { flex: 1; text-align: center; background: var(--card2); border-radius: 999px; padding: 7px; font-size: 0.88rem; font-weight: 700 }
.body2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.bcard { background: var(--card); border-radius: 18px; padding: 14px; display: grid; gap: 4px; align-content: start; text-align: left; position: relative; min-height: 132px }
.bcard.full { grid-column: 1 / -1; min-height: 0 }
.bcard .plus { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px }
.bcard small { color: var(--muted); font-size: 0.8rem }
.bcard .v { font-weight: 900; font-size: 1.7rem; letter-spacing: -0.01em } .bcard .v span { font-size: 0.85rem; font-weight: 400; color: var(--muted) }
.bcard .v.none { font-size: 1.15rem; color: var(--dim) }
.spark { width: 100%; height: 36px; display: block } .spark path { fill: none; stroke: var(--dim); stroke-width: 1.5; stroke-dasharray: 3 3 } .spark .ln2 { stroke: var(--amber); stroke-dasharray: none; stroke-width: 2 } .spark circle { fill: var(--ink) }
.gauge { display: flex; gap: 3px; height: 6px; margin-top: 6px; position: relative } .gauge i { flex: 1; border-radius: 3px }
.gauge b { position: absolute; top: -4px; width: 3px; height: 14px; background: var(--ink); border-radius: 2px }
.ok { color: var(--teal); font-weight: 700; font-size: 0.8rem }
.stats5 { display: grid; grid-template-columns: repeat(5, 1fr); text-align: center; gap: 2px }
.stats5 div { display: grid; gap: 1px; justify-items: center } .stats5 b { font-weight: 900; font-size: 1.05rem } .stats5 small { font-size: 0.68rem; color: var(--muted) }
.stats5 .ic { font-size: 0.95rem; color: var(--amber) }

/* connect */
.search { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 14px; padding: 0 12px } .search input { background: none; border: 0; padding: 11px 0 }
.person { display: flex; align-items: center; gap: 12px; padding: 12px 4px; width: 100%; text-align: left; border-bottom: 1px solid var(--line) }
.av { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 1.3rem; flex: none; background: #26313a; color: #a9c6dd }
.av.coach { background: var(--amber); color: var(--amber-ink) }
.person b { font-weight: 700 } .person small { display: block; color: var(--muted); font-size: 0.84rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.beta { font-size: 0.62rem; border: 1px solid var(--line2); border-radius: 6px; padding: 0 5px; margin-left: 6px; color: var(--muted); vertical-align: middle }
.unread { width: 10px; height: 10px; border-radius: 50%; background: var(--amber); flex: none }
.invite { text-align: center; display: grid; gap: 6px; justify-items: center; padding: 30px 0 }
.invite b { font-size: 1.05rem }
.chat { display: grid; gap: 8px; align-content: start; min-height: 40vh; max-height: 58vh; overflow-y: auto; padding: 4px 0 }
.msg { max-width: 82%; padding: 9px 13px; border-radius: 18px; white-space: pre-wrap; font-size: 0.95rem; line-height: 1.5 }
.msg.u { justify-self: end; background: var(--amber); color: var(--amber-ink); border-bottom-right-radius: 6px }
.msg.a { justify-self: start; background: var(--card); border-bottom-left-radius: 6px }
.msg img { display: block; max-width: 160px; border-radius: 10px; margin-bottom: 6px }
.composer { display: flex; gap: 8px; align-items: flex-end } .composer textarea { resize: none; height: 46px; max-height: 120px }

/* profile */
.prof { display: flex; align-items: center; gap: 14px }
.prof .av { width: 60px; height: 60px; background: #3a2c1c; color: var(--amber); font-size: 1.5rem }
.prof b { font-size: 1.3rem; font-weight: 900 }
.list { background: var(--card); border-radius: 18px; overflow: hidden }
.li { display: flex; align-items: center; gap: 14px; padding: 13px 16px; width: 100%; text-align: left }
.li + .li { border-top: 1px solid var(--line) }
.li > .ic { color: var(--amber); font-size: 1.05rem }
.li .grow small { display: block; color: var(--muted); font-size: 0.8rem }
.li .chev { color: var(--dim) }
.li.red, .li.red > .ic { color: var(--red) }
.foot { text-align: center; color: var(--dim); font-size: 0.76rem; padding: 18px 0 }

/* tab bar and add button */
.nav { position: fixed; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 20 }
.nav .wrap { display: flex; gap: 10px; align-items: center }
.navpill { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); background: rgba(40, 36, 33, 0.82); border: 1px solid var(--line2); border-radius: 999px; padding: 5px;
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5) }
.navpill button { display: grid; justify-items: center; gap: 1px; padding: 6px 0; border-radius: 999px; font-size: 0.7rem; font-weight: 700; color: var(--ink) }
.navpill button .ic { font-size: 1.15rem }
.navpill button[aria-current="page"] { background: rgba(255, 255, 255, 0.1); color: var(--amber) }
.addbtn { width: 62px; height: 62px; border-radius: 50%; background: var(--amber); color: var(--amber-ink); display: grid; place-items: center; font-size: 1.8rem; flex: none; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); transition: transform 0.2s }
.addbtn[aria-expanded="true"] { transform: rotate(45deg) }
@media (prefers-reduced-motion: reduce) { .addbtn { transition: none } }

/* add menu */
.menu { position: fixed; inset: 0; z-index: 19; background: rgba(10, 9, 9, 0.6); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); display: flex; align-items: flex-end }
.menu .wrap { width: 100%; padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px)) }
.menubox { background: rgba(40, 36, 33, 0.95); border: 1px solid var(--line2); border-radius: 26px; padding: 16px; display: grid; gap: 12px }
.menubox h2 { font-size: 1rem; font-weight: 900 } .menubox h2 small { font-weight: 400; color: var(--muted); font-size: 0.82rem; margin-left: 6px }
.mgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 6px }
.mgrid button { display: grid; justify-items: center; gap: 6px; font-size: 0.85rem; font-weight: 700 }
.mgrid .ic { width: 52px; height: 52px; border-radius: 50%; background: #33291d; color: var(--amber); font-size: 1.25rem }
.mfoot { background: rgba(0, 0, 0, 0.25); border-radius: 12px; padding: 7px; text-align: center; font-size: 0.78rem; color: var(--muted) } .mfoot b { color: var(--amber) }

/* sheets */
dialog { color: var(--ink) }
dialog::backdrop { background: rgba(0, 0, 0, 0.65) }
dialog.sheet { margin: auto auto 0; width: 100%; max-width: 560px; max-height: 92vh; border: 1px solid var(--line2); border-bottom: 0; border-radius: 26px 26px 0 0; background: #201d1b;
  padding: 16px 16px calc(18px + env(safe-area-inset-bottom, 0px)); overflow: auto }
dialog.sheet[open] { display: grid; gap: 14px }
.sheethead { display: flex; align-items: center; gap: 10px } .sheethead h2 { flex: 1; font-size: 1.2rem; font-weight: 900 }
dialog.keydlg { border: 1px solid var(--line2); border-radius: 22px; padding: 18px; width: min(440px, 92vw); background: #201d1b }
dialog.keydlg[open] { display: grid; gap: 12px } dialog.keydlg h2 { font-size: 1.2rem; font-weight: 900 }
dialog.keydlg .desc { color: var(--muted); font-size: 0.9rem } dialog.keydlg .chip { border: 1px solid var(--line2); border-radius: 999px; padding: 8px 14px }
.thumb { width: 100%; max-height: 240px; object-fit: cover; border-radius: 16px; display: block }
.spin { width: 38px; height: 38px; border-radius: 50%; border: 4px solid var(--line2); border-top-color: var(--amber); animation: spin 0.9s linear infinite; justify-self: center }
@keyframes spin { to { transform: rotate(360deg) } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s } }
.hits { display: grid; gap: 6px }
.hits button { display: flex; justify-content: space-between; gap: 10px; text-align: left; background: var(--card); border-radius: 14px; padding: 11px 12px } .hits button span { color: var(--muted); white-space: nowrap }
.rrow { display: grid; grid-template-columns: minmax(0, 1fr) 88px 36px; gap: 6px; align-items: center } .rrow input { padding: 8px 10px }
.kv { display: grid; margin: 0 } .kv div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line) } .kv div:last-child { border-bottom: 0 }
.kv dt { color: var(--muted) } .kv dd { margin: 0; font-weight: 700; text-align: right }
.warn { background: #3a2812; color: #ffd08a; border-radius: 14px; padding: 10px 12px; font-size: 0.86rem }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: var(--ink); color: #1a1512; padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 0.9rem; max-width: 90vw; text-align: center }
.code { font-weight: 900; font-size: 1.8rem; letter-spacing: 0.12em; text-align: center; background: var(--card); border-radius: 14px; padding: 10px }
.prose { display: grid; gap: 10px; font-size: 0.92rem; color: #d9d1c9 }

/* first-run questions */
.onb { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow: auto }
.onb .wrap { min-height: 100%; display: flex; flex-direction: column; gap: 18px; padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)) }

.onb h1 { font-size: 1.8rem; font-weight: 900; line-height: 1.25 }
.onb .body { display: grid; gap: 14px; align-content: start; flex: 1 }
.onb .footer { display: grid; gap: 10px } .onb .footer .primary { padding: 15px; font-size: 1.05rem }

.hero img { width: 110px; height: 110px; border-radius: 50%; border: 3px solid var(--amber); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5) }
.hero .brand { font-size: 3rem; flex: none } .hero p { color: var(--muted); font-size: 1.1rem; white-space: pre-line }
.bmi { font-weight: 700; color: var(--amber) }

      var local; try { local = cleanDays(JSON.parse(localStorage.getItem(k))); } catch (e) { return; }
      if (!Object.keys(local).length) { try { localStorage.removeItem(k); } catch (e) {} return; }
      mutate(new Date(+k.slice(-7, -3), +k.slice(-2) - 1, 1), function (d) {
        Object.keys(local).forEach(function (day) {
          if (day.charAt(0) === "w") { if (local[day].length > (d[day] || []).length) d[day] = local[day]; return; }
          var have = {}; (d[day] = d[day] || []).forEach(function (e) { have[e.id] = true; });
          local[day].forEach(function (e) { if (!have[e.id]) d[day].push(e); });
        });
      }).then(function () { try { localStorage.removeItem(k); } catch (e) {} }, function () {});
    });
  });
  // The account and API key buttons are added by app.js once the page has loaded; redraw so 個人 shows their state.
  document.addEventListener("DOMContentLoaded", function () { setTimeout(soon, 50); });
  // The API key dialog changes its button's label; dialogs do not bubble "close", so listen while capturing.
  document.addEventListener("close", function (ev) { if (ev.target && ev.target.classList && ev.target.classList.contains("keydlg")) soon(); }, true);
  var lastDay = isoDay(today0());
  setInterval(function () { var d = isoDay(today0()); if (d !== lastDay) { if (sel === lastDay) sel = d; lastDay = d; soon(); } }, 60000);
})();
